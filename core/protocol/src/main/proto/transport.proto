// Envelope recovered from baleclient/transport.py. Its executable encoding
// places RequestBody directly in WsRequest.field1 (no extra Request wrapper).
syntax = "proto3";
package bale.transport;
option java_package = "ai.bale.client.protocol.transport";
option java_multiple_files = true;
option java_outer_classname = "TransportSchema";
message SocketRequest {
  RpcRequest request = 1;
  Heartbeat ping = 2;
  Handshake handshake_request = 3;
}
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
  Metadata metadata = 4;
  int64 request_id = 5;
}
message Metadata { repeated MetadataEntry entries = 1; }
message MetadataEntry { string name = 1; MetadataValue value = 2; }
message MetadataValue { string text = 1; int64 number = 4; }
message Handshake { int32 mkproto_version = 1; int64 api_version = 2; int64 server_time = 3; }
message Heartbeat { int64 id = 1; }
message SocketResponse {
  RpcResponse response = 1;
  UpdateEnvelope update = 2;
  optional bytes terminate_session = 3;
  Heartbeat pong = 4;
  Handshake handshake_response = 5;
}
message RpcResponse { RpcError error = 1; bytes result = 2; int64 number = 3; }
message RpcError { int64 topic = 1; string message = 2; }
message UpdateEnvelope { bytes update = 1; }
